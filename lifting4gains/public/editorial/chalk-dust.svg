<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice" role="presentation">
  <defs>
    <linearGradient id="skychk" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#191920"/>
      <stop offset="55%" stop-color="#111116"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <radialGradient id="keychk" cx="0.34" cy="0.22" r="0.75">
      <stop offset="0%" stop-color="#5c5c6b" stop-opacity="1"/>
      <stop offset="45%" stop-color="#2c2c36" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vigchk" cx="0.5" cy="0.45" r="0.78">
      <stop offset="58%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
    <filter id="grainchk" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="dustchk" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="5" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="gamma" exponent="3.4" amplitude="1.5"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#skychk)"/>
  <rect width="1600" height="900" fill="url(#keychk)"/>

  
