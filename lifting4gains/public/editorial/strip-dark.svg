<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400" preserveAspectRatio="xMidYMid slice" role="presentation">
  <defs>
    <linearGradient id="skystp" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#191920"/>
      <stop offset="55%" stop-color="#111116"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <radialGradient id="keystp" cx="0.34" cy="0.22" r="0.75">
      <stop offset="0%" stop-color="#5c5c6b" stop-opacity="1"/>
      <stop offset="45%" stop-color="#2c2c36" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vigstp" cx="0.5" cy="0.45" r="0.78">
      <stop offset="58%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
    <filter id="grainstp" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="duststp" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="5" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="gamma" exponent="3.4" amplitude="1.5"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="400" fill="url(#skystp)"/>
  <rect width="1600" height="400" fill="url(#keystp)"/>

  
    <rect x="-60" y="-40" width="96" height="480" fill="#0a0a0e" opacity="0.5" transform="skewX(-8)"/><rect x="190" y="-40" width="96" height="480" fill="#0a0a0e" opacity="0.65" transform="skewX(-8)"/><rect x="440" y="-40" width="96" height="480" fill="#0a0a0e" opacity="0.8" transform="skewX(-8)"/><rect x="690" y="-40" width="96" height="480" fill="#0a0a0e" opacity="0.5" transform="skewX(-8)"/><rect x="940" y="-40" width="96" height="480" fill="#0a0a0e" opacity="0.65" transform="skewX(-8)"/><rect x="1190" y="-40" width="96" height="480" fill="#0a0a0e" opacity="0.8" transform="skewX(-8)"/><rect x="1440" y="-40" width="96" height="480" fill="#0a0a0e" opacity="0.5" transform="skewX(-8)"/>
    <rect x="0" y="340" width="1600" height="60" fill="#08080a"/>
    

  <!-- airborne chalk dust catching the key light -->
  <rect width="1600" height="400" filter="url(#duststp)" opacity="0.18" fill="#f4f2ee"/>
  <rect width="1600" height="400" fill="url(#vigstp)"/>
  <rect width="1600" height="400" filter="url(#grainstp)" opacity="0.075" style="mix-blend-mode:overlay"/>
</svg>
