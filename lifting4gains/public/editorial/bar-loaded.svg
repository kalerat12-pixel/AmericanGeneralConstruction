<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice" role="presentation">
  <defs>
    <linearGradient id="skybar" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#191920"/>
      <stop offset="55%" stop-color="#111116"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <radialGradient id="keybar" cx="0.34" cy="0.22" r="0.75">
      <stop offset="0%" stop-color="#5c5c6b" stop-opacity="1"/>
      <stop offset="45%" stop-color="#2c2c36" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vigbar" cx="0.5" cy="0.45" r="0.78">
      <stop offset="58%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
    <filter id="grainbar" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="dustbar" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="5" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="gamma" exponent="3.4" amplitude="1.5"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#skybar)"/>
  <rect width="1920" height="1080" fill="url(#keybar)"/>

  
    <!-- back wall seam -->
    <rect x="0" y="0" width="1920" height="742" fill="#0e0e13" opacity="0.55"/>
    <rect x="0" y="740" width="1920" height="3" fill="#f4f2ee" opacity="0.05"/>
    <!-- platform boards -->
    <rect x="0" y="744" width="1920" height="2" fill="#000" opacity="0.5"/><rect x="0" y="782" width="1920" height="2" fill="#000" opacity="0.5"/><rect x="0" y="820" width="1920" height="2" fill="#000" opacity="0.5"/><rect x="0" y="858" width="1920" height="2" fill="#000" opacity="0.5"/><rect x="0" y="896" width="1920" height="2" fill="#000" opacity="0.5"/><rect x="0" y="934" width="1920" height="2" fill="#000" opacity="0.5"/><rect x="0" y="972" width="1920" height="2" fill="#000" opacity="0.5"/><rect x="0" y="1010" width="1920" height="2" fill="#000" opacity="0.5"/><rect x="0" y="1048" width="1920" height="2" fill="#000" opacity="0.5"/>
    <ellipse cx="960" cy="905" rx="620" ry="60" fill="#000" opacity="0.6"/>
    <g opacity="1" transform="translate(960 760) scale(1) translate(-960 -760)">
    <!-- bar -->
    <rect x="320" y="751" width="1280" height="18" rx="9" fill="#16161c"/>
    <rect x="320" y="751" width="1280" height="5" rx="2.5" fill="#3d3d47"/>
    <!-- knurl marks -->
    <rect x="760" y="752" width="2" height="16" fill="#000" opacity="0.55"/><rect x="778" y="752" width="2" height="16" fill="#000" opacity="0.55"/><rect x="796" y="752" width="2" height="16" fill="#000" opacity="0.55"/><rect x="814" y="752" width="2" height="16" fill="#000" opacity="0.55"/><rect x="832" y="752" width="2" height="16" fill="#000" opacity="0.55"/><rect x="850" y="752" width="2" height="16" fill="#000" opacity="0.55"/><rect x="868" y="752" width="2" height="16" fill="#000" opacity="0.55"/><rect x="886" y="752" width="2" height="16" fill="#000" opacity="0.55"/><rect x="904" y="752" width="2" height="16" fill="#000" opacity="0.55"/><rect x="922" y="752" width="2" height="16" fill="#000" opacity="0.55"/><rect x="940" y="752" width="2" height="16" fill="#000" opacity="0.55"/><rect x="958" y="752" width="2" height="16" fill="#000" opacity="0.55"/><rect x="976" y="752" width="2" height="16" fill="#000" opacity="0.55"/><rect x="994" y="752" width="2" height="16" fill="#000" opacity="0.55"/><rect x="1012" y="752" width="2" height="16" fill="#000" opacity="0.55"/><rect x="1030" y="752" width="2" height="16" fill="#000" opacity="0.55"/><rect x="1048" y="752" width="2" height="16" fill="#000" opacity="0.55"/><rect x="1066" y="752" width="2" height="16" fill="#000" opacity="0.55"/><rect x="1084" y="752" width="2" height="16" fill="#000" opacity="0.55"/><rect x="1102" y="752" width="2" height="16" fill="#000" opacity="0.55"/><rect x="1120" y="752" width="2" height="16" fill="#000" opacity="0.55"/><rect x="1138" y="752" width="2" height="16" fill="#000" opacity="0.55"/>
    <!-- collars -->
    <rect x="660" y="738" width="26" height="44" rx="6" fill="#101015"/>
    <rect x="1234" y="738" width="26" height="44" rx="6" fill="#101015"/>
    <g transform="translate(590 760)">
       <rect x="-17" y="-150" width="34" height="300" rx="17" fill="#0a0a0c"/>
       <rect x="-17" y="-150" width="14.28" height="300" rx="8.5" fill="#1e1e25"/>
       <ellipse cx="0" cy="0" rx="5.44" ry="25.500000000000004" fill="#2b2b34"/>
     </g>
    <g transform="translate(550 760)">
       <rect x="-15" y="-150" width="30" height="300" rx="15" fill="#0a0a0c"/>
       <rect x="-15" y="-150" width="12.6" height="300" rx="7.5" fill="#1e1e25"/>
       <ellipse cx="0" cy="0" rx="4.8" ry="25.500000000000004" fill="#2b2b34"/>
     </g>
    <g transform="translate(516 760)">
       <rect x="-11" y="-128" width="22" height="256" rx="11" fill="#0a0a0c"/>
       <rect x="-11" y="-128" width="9.24" height="256" rx="5.5" fill="#1e1e25"/>
       <ellipse cx="0" cy="0" rx="3.52" ry="21.76" fill="#2b2b34"/>
     </g>
    <g transform="translate(1330 760)">
       <rect x="-17" y="-150" width="34" height="300" rx="17" fill="#0a0a0c"/>
       <rect x="-17" y="-150" width="14.28" height="300" rx="8.5" fill="#1e1e25"/>
       <ellipse cx="0" cy="0" rx="5.44" ry="25.500000000000004" fill="#2b2b34"/>
     </g>
    <g transform="translate(1370 760)">
       <rect x="-15" y="-150" width="30" height="300" rx="15" fill="#0a0a0c"/>
       <rect x="-15" y="-150" width="12.6" height="300" rx="7.5" fill="#1e1e25"/>
       <ellipse cx="0" cy="0" rx="4.8" ry="25.500000000000004" fill="#2b2b34"/>
     </g>
    <g transform="translate(1404 760)">
       <rect x="-11" y="-128" width="22" height="256" rx="11" fill="#0a0a0c"/>
       <rect x="-11" y="-128" width="9.24" height="256" rx="5.5" fill="#1e1e25"/>
       <ellipse cx="0" cy="0" rx="3.52" ry="21.76" fill="#2b2b34"/>
     </g>
  </g>
    

  <!-- airborne chalk dust catching the key light -->
  <rect width="1920" height="1080" filter="url(#dustbar)" opacity="0.18" fill="#f4f2ee"/>
  <rect width="1920" height="1080" fill="url(#vigbar)"/>
  <rect width="1920" height="1080" filter="url(#grainbar)" opacity="0.075" style="mix-blend-mode:overlay"/>
</svg>
