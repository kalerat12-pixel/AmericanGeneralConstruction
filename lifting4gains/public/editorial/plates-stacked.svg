<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" preserveAspectRatio="xMidYMid slice" role="presentation">
  <defs>
    <linearGradient id="skyplt" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#191920"/>
      <stop offset="55%" stop-color="#111116"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <radialGradient id="keyplt" cx="0.34" cy="0.22" r="0.75">
      <stop offset="0%" stop-color="#5c5c6b" stop-opacity="1"/>
      <stop offset="45%" stop-color="#2c2c36" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vigplt" cx="0.5" cy="0.45" r="0.78">
      <stop offset="58%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
    <filter id="grainplt" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="dustplt" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="5" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="gamma" exponent="3.4" amplitude="1.5"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#skyplt)"/>
  <rect width="1600" height="1000" fill="url(#keyplt)"/>

  
    <g>
      
        <circle cx="430" cy="560" r="300" fill="#0b0b0e"/>
        <circle cx="430" cy="560" r="300" fill="none" stroke="#f4f2ee" stroke-opacity="0.1" stroke-width="2"/>
        <circle cx="430" cy="560" r="216" fill="none" stroke="#f4f2ee" stroke-opacity="0.06" stroke-width="1.5"/>
        <circle cx="430" cy="560" r="60" fill="#15151b"/>
        <circle cx="430" cy="560" r="60" fill="none" stroke="#9b9690" stroke-opacity="0.16" stroke-width="2"/>
      
        <circle cx="800" cy="620" r="340" fill="#0b0b0e"/>
        <circle cx="800" cy="620" r="340" fill="none" stroke="#f4f2ee" stroke-opacity="0.13" stroke-width="2"/>
        <circle cx="800" cy="620" r="244.79999999999998" fill="none" stroke="#f4f2ee" stroke-opacity="0.06" stroke-width="1.5"/>
        <circle cx="800" cy="620" r="68" fill="#15151b"/>
        <circle cx="800" cy="620" r="68" fill="none" stroke="#9b9690" stroke-opacity="0.16" stroke-width="2"/>
      
        <circle cx="1210" cy="540" r="280" fill="#0b0b0e"/>
        <circle cx="1210" cy="540" r="280" fill="none" stroke="#f4f2ee" stroke-opacity="0.16" stroke-width="2"/>
        <circle cx="1210" cy="540" r="201.6" fill="none" stroke="#f4f2ee" stroke-opacity="0.06" stroke-width="1.5"/>
        <circle cx="1210" cy="540" r="56" fill="#15151b"/>
        <circle cx="1210" cy="540" r="56" fill="none" stroke="#9b9690" stroke-opacity="0.16" stroke-width="2"/>
      
    </g>
    <rect x="0" y="880" width="1600" height="120" fill="#08080a"/>
    <rect x="0" y="878" width="1600" height="2" fill="#f4f2ee" opacity="0.06"/>
    

  <!-- airborne chalk dust catching the key light -->
  <rect width="1600" height="1000" filter="url(#dustplt)" opacity="0.18" fill="#f4f2ee"/>
  <rect width="1600" height="1000" fill="url(#vigplt)"/>
  <rect width="1600" height="1000" filter="url(#grainplt)" opacity="0.075" style="mix-blend-mode:overlay"/>
</svg>
