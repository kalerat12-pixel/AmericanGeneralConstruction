<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" width="400" height="640" role="img" aria-label="Placeholder can artwork for Sour Watermelon">
  <defs>
    <linearGradient id="bodyhydrationwarheadssourwatermelon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#251419"/>
      <stop offset="18%" stop-color="#7A2A38"/>
      <stop offset="46%" stop-color="#7A2A38"/>
      <stop offset="62%" stop-color="#251419"/>
      <stop offset="100%" stop-color="#251419"/>
    </linearGradient>
    <linearGradient id="metalhydrationwarheadssourwatermelon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2a2f"/>
      <stop offset="30%" stop-color="#6b6b73"/>
      <stop offset="55%" stop-color="#3a3a41"/>
      <stop offset="100%" stop-color="#22222a"/>
    </linearGradient>
    <filter id="grainhydrationwarheadssourwatermelon">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="d"/>
      <feComposite operator="in" in="d" in2="SourceGraphic"/>
    </filter>
    <clipPath id="cliphydrationwarheadssourwatermelon">
      <path d="M112 96 h176 a14 14 0 0 1 14 14 v404 a14 14 0 0 1 -14 14 h-176 a14 14 0 0 1 -14 -14 v-404 a14 14 0 0 1 14 -14 z"/>
    </clipPath>
  </defs>

  <rect width="400" height="640" fill="#0d0d0f"/>

  <!-- floor shadow: one soft ellipse, no decorative drop shadows -->
  <ellipse cx="200" cy="556" rx="104" ry="15" fill="#000" opacity="0.55"/>

  <!-- lid -->
  <ellipse cx="200" cy="96" rx="88" ry="15" fill="url(#metalhydrationwarheadssourwatermelon)"/>
  <ellipse cx="200" cy="93" rx="72" ry="11" fill="#1b1b21"/>
  <ellipse cx="200" cy="93" rx="40" ry="6" fill="#2e2e36"/>

  <!-- body -->
  <path d="M112 96 h176 a14 14 0 0 1 14 14 v404 a14 14 0 0 1 -14 14 h-176 a14 14 0 0 1 -14 -14 v-404 a14 14 0 0 1 14 -14 z" fill="url(#bodyhydrationwarheadssourwatermelon)"/>

  <g clip-path="url(#cliphydrationwarheadssourwatermelon)">
    <!-- cylinder shading: darken the edges so it reads as round -->
    <rect x="98" y="96" width="34" height="432" fill="#000" opacity="0.42"/>
    <rect x="268" y="96" width="34" height="432" fill="#000" opacity="0.5"/>
    <rect x="150" y="96" width="26" height="432" fill="#f4f2ee" opacity="0.06"/>

    <!-- diagonal placeholder band -->
    <g transform="rotate(-38 200 300)">
      <rect x="40" y="272" width="320" height="56" fill="#0d0d0f" opacity="0.82"/>
      <text x="200" y="308" text-anchor="middle" font-family="Archivo, Inter, Helvetica, Arial, sans-serif"
            font-size="21" font-weight="700" letter-spacing="5" fill="#e2a03f">PLACEHOLDER</text>
    </g>

    <!-- label -->
    <text x="200" y="196" text-anchor="middle" font-family="Archivo, Inter, Helvetica, Arial, sans-serif"
          font-size="13" font-weight="700" letter-spacing="5.5" fill="#f4f2ee" opacity="0.72">HYDRATION</text>
    <text x="200" y="230" text-anchor="middle" font-family="Archivo, Inter, Helvetica, Arial, sans-serif"
          font-size="14" font-weight="700" letter-spacing="3" fill="#f4f2ee" opacity="0.9">WARHEADS</text>
    <text x="200" y="262" text-anchor="middle" font-family="Archivo, Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" letter-spacing="-0.5" fill="#f4f2ee">SOUR</text>
    <text x="200" y="291" text-anchor="middle" font-family="Archivo, Inter, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" letter-spacing="-0.5" fill="#f4f2ee">WATERMELON</text>

    <line x1="140" y1="317" x2="260" y2="317" stroke="#f4f2ee" stroke-opacity="0.28"/>

    <text x="200" y="418" text-anchor="middle" font-family="Archivo, Inter, Helvetica, Arial, sans-serif"
          font-size="12" font-weight="700" letter-spacing="3" fill="#f4f2ee" opacity="0.62">16 FL OZ</text>
    <text x="200" y="446" text-anchor="middle" font-family="Archivo, Inter, Helvetica, Arial, sans-serif"
          font-size="12" font-weight="700" letter-spacing="3" fill="#f4f2ee" opacity="0.62">CAFFEINE FREE</text>
    <text x="200" y="474" text-anchor="middle" font-family="Archivo, Inter, Helvetica, Arial, sans-serif"
          font-size="12" font-weight="700" letter-spacing="3" fill="#f4f2ee" opacity="0.62">ZERO SUGAR</text>

    <rect x="98" y="96" width="204" height="432" filter="url(#grainhydrationwarheadssourwatermelon)" opacity="0.1"/>
  </g>

  <!-- base rim -->
  <ellipse cx="200" cy="528" rx="88" ry="14" fill="url(#metalhydrationwarheadssourwatermelon)"/>
  <ellipse cx="200" cy="528" rx="74" ry="9" fill="#15151a"/>
</svg>
