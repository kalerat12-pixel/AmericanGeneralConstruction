<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start</title>

<!-- ======================================================================
     YOUR SETTINGS  -  everything you'd want to tweak lives in this block.
     Edit the values, save, refresh. Nothing else in the file needs touching.
     ====================================================================== -->
<script>
const CONFIG = {

  // Your name, used in the greeting ("Good morning, Kale").
  // Leave as "" for a plain "Good morning".
  name: "Kale",

  // Theme on first visit: "light", "dark", or "system" (follow the OS).
  // Once you press the sun/moon button your choice is remembered and wins.
  defaultTheme: "light",

  // Clock.
  clock: {
    hour12: true,        // true = 2:07 PM, false = 14:07
    showSeconds: false,  // true = 2:07:31 PM
  },

  // Which search engine is selected by default (a key from searchEngines).
  // Switching engines with the chips under the search bar is remembered too.
  searchEngine: "duckduckgo",

  // The engines you can pick from. `url` is the search endpoint; your query
  // gets URL-encoded and appended to the end. Add, remove or reorder freely.
  searchEngines: {
    duckduckgo: { label: "DuckDuckGo", url: "https://duckduckgo.com/?q=" },
    google:     { label: "Google",     url: "https://www.google.com/search?q=" },
    bing:       { label: "Bing",       url: "https://www.bing.com/search?q=" },
    brave:      { label: "Brave",      url: "https://search.brave.com/search?q=" },
  },

  // Optional widgets below the quick links. true = show, false = hide.
  // Both save to this browser's localStorage, so they're private to this
  // browser/device and don't sync anywhere.
  widgets: {
    notes: true,  // scratchpad
    todo: true,   // to-do list
  },

  // Quick-link tiles, shown in this order.
  //   name : the label under the icon
  //   url  : where the tile goes
  //   icon : (optional) your own image URL; otherwise the site's favicon is used
  links: [
    { name: "Gmail",     url: "https://mail.google.com" },
    { name: "Calendar",  url: "https://calendar.google.com" },
    { name: "Drive",     url: "https://drive.google.com" },
    { name: "YouTube",   url: "https://www.youtube.com" },
    { name: "GitHub",    url: "https://github.com" },
    { name: "Claude",    url: "https://claude.ai" },
    { name: "Maps",      url: "https://maps.google.com" },
    { name: "Reddit",    url: "https://www.reddit.com" },
    { name: "Spotify",   url: "https://open.spotify.com" },
    { name: "Wikipedia", url: "https://www.wikipedia.org" },
    { name: "Amazon",    url: "https://www.amazon.com" },
    { name: "Netflix",   url: "https://www.netflix.com" },
  ],
};
</script>
<!-- ============================== END OF SETTINGS ============================== -->

<script>
  /* Internals below. Sets the theme before first paint so there's no flash. */
  const STORE_PREFIX = "startpage:";
  (function () {
    var theme = null;
    try { theme = JSON.parse(localStorage.getItem(STORE_PREFIX + "theme")); } catch (e) {}
    if (theme !== "light" && theme !== "dark") {
      var pref = CONFIG.defaultTheme;
      theme = pref === "dark" ? "dark"
        : pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark"
        : "light";
    }
    document.documentElement.dataset.theme = theme;
  })();
</script>

<style>
  /* ---------- Design tokens ---------- */
  :root {
    --font-display: "Fraunces", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --font-ui: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    --bg: #faf7f2;
    --glow: radial-gradient(60rem 28rem at 50% -8%, rgba(207, 91, 51, .08), transparent 70%);
    --surface: #ffffff;
    --surface-2: #f4efe7;
    --text: #231f19;
    --muted: #7d7568;
    --line: #ebe4d9;
    --line-strong: #d6cdbf;
    --accent: #cf5b33;
    --accent-ink: #b0451f;
    --accent-soft: rgba(207, 91, 51, .10);
    --ring: rgba(207, 91, 51, .20);
    --shadow: 0 1px 2px rgba(70, 45, 20, .05), 0 12px 32px -14px rgba(70, 45, 20, .16);
    --shadow-lift: 0 2px 4px rgba(70, 45, 20, .05), 0 18px 36px -14px rgba(70, 45, 20, .24);

    --radius: 20px;
    --content: 760px;
    color-scheme: light;
  }

  :root[data-theme="dark"] {
    --bg: #151310;
    --glow: radial-gradient(60rem 28rem at 50% -8%, rgba(240, 138, 93, .11), transparent 70%);
    --surface: #1e1b16;
    --surface-2: #28241d;
    --text: #f2ede3;
    --muted: #a0988a;
    --line: #302b23;
    --line-strong: #463f34;
    --accent: #f08a5d;
    --accent-ink: #f5a47f;
    --accent-soft: rgba(240, 138, 93, .14);
    --ring: rgba(240, 138, 93, .26);
    --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 14px 34px -16px rgba(0, 0, 0, .65);
    --shadow-lift: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 20px 40px -16px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }

  /* ---------- Base ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font-ui);
    font-size: 16px;
    line-height: 1.5;
    color: var(--text);
    background-color: var(--bg);
    background-image: var(--glow);
    background-repeat: no-repeat;
    -webkit-font-smoothing: antialiased;
    transition: background-color .3s ease, color .3s ease;
  }

  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ---------- Layout ---------- */
  .page { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

  .topbar {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding-top: 28px;
  }

  .stage {
    display: flex; flex-direction: column; align-items: center;
    padding: clamp(28px, 9vh, 88px) 0 96px;
  }

  /* ---------- Clock + theme toggle ---------- */
  .clock { line-height: 1.1; }
  .clock-time {
    display: block;
    font-family: var(--font-display);
    font-weight: 300;
    font-size: clamp(2rem, 4vw, 2.6rem);
    letter-spacing: -.01em;
    font-variant-numeric: tabular-nums;
  }
  .clock-time .period {
    margin-left: .22em;
    font-family: var(--font-ui);
    font-size: .38em;
    font-weight: 500;
    letter-spacing: .08em;
    color: var(--muted);
  }
  .clock-date { display: block; margin-top: 8px; font-size: .9rem; color: var(--muted); }

  .icon-btn {
    display: grid; place-items: center;
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--line);
    color: var(--muted);
    transition: color .2s, border-color .2s, transform .2s, background-color .3s;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--line-strong); transform: rotate(14deg); }
  .icon-btn svg { width: 19px; height: 19px; }
  .icon-btn .i-sun { display: none; }
  :root[data-theme="dark"] .icon-btn .i-sun { display: block; }
  :root[data-theme="dark"] .icon-btn .i-moon { display: none; }

  /* ---------- Greeting + search ---------- */
  .greeting {
    margin: 0 0 22px;
    font-family: var(--font-display);
    font-style: italic;
    font-weight: 300;
    font-size: clamp(1.15rem, 2.4vw, 1.4rem);
    color: var(--muted);
    text-align: center;
  }

  .search {
    position: relative;
    display: flex; align-items: center; gap: 14px;
    width: 100%; max-width: 680px; height: 64px;
    padding: 0 12px 0 24px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    box-shadow: var(--shadow);
    transition: border-color .2s, box-shadow .2s, background-color .3s;
  }
  .search:focus-within {
    border-color: var(--accent);
    box-shadow: var(--shadow), 0 0 0 5px var(--ring);
  }
  .search > svg { width: 20px; height: 20px; flex: none; color: var(--muted); }
  .search input {
    flex: 1; min-width: 0; height: 100%;
    font-size: 1.15rem;
    background: transparent; border: 0; outline: 0;
  }
  .search input::placeholder { color: var(--muted); opacity: .8; }
  .search input::-webkit-search-cancel-button { display: none; }

  .search .kbd {
    flex: none; min-width: 26px; height: 26px; padding: 0 8px;
    display: grid; place-items: center;
    margin-right: 12px;
    font-size: .8rem; font-weight: 500; color: var(--muted);
    border: 1px solid var(--line-strong); border-radius: 7px;
  }
  .search input:focus ~ .kbd,
  .search input:not(:placeholder-shown) ~ .kbd { display: none; }
  @media (hover: none) { .search .kbd { display: none; } }

  .search .go {
    flex: none; width: 42px; height: 42px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--accent); border: 0; color: #fff;
    transition: opacity .2s, visibility .2s, transform .2s;
  }
  .search .go svg { width: 18px; height: 18px; }
  .search .go:hover { transform: scale(1.06); }
  .search input:placeholder-shown ~ .go { opacity: 0; visibility: hidden; }

  .engines {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
    margin-top: 18px;
  }
  .engines button {
    padding: 6px 14px;
    font-size: .85rem; font-weight: 500; color: var(--muted);
    background: transparent; border: 1px solid transparent; border-radius: 999px;
    transition: color .2s, background-color .2s, border-color .2s;
  }
  .engines button:hover { color: var(--text); }
  .engines button[aria-pressed="true"] {
    color: var(--accent-ink); background: var(--accent-soft);
  }

  /* ---------- Quick links ---------- */
  .tiles {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 14px;
    width: 100%; max-width: var(--content);
    margin-top: clamp(40px, 8vh, 72px);
  }
  .tile {
    width: 112px;
    display: flex; flex-direction: column; align-items: center; gap: 11px;
    padding: 20px 8px 16px;
    color: var(--text); text-decoration: none;
    background: var(--surface);
    border: 1px solid var(--line); border-radius: 18px;
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s, background-color .3s;
  }
  .tile:hover, .tile:focus-visible {
    transform: translateY(-3px);
    border-color: var(--line-strong);
    box-shadow: var(--shadow-lift);
  }
  .tile-icon {
    width: 46px; height: 46px; border-radius: 13px;
    display: grid; place-items: center;
    background: var(--surface-2);
    transition: background-color .3s;
  }
  .tile-icon img { width: 28px; height: 28px; border-radius: 6px; display: block; }
  .tile-icon .mono {
    font-family: var(--font-display); font-size: 1.35rem; font-weight: 400;
    color: var(--accent-ink);
  }
  .tile-label {
    max-width: 100%;
    font-size: .84rem; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ---------- Widgets ---------- */
  .widgets {
    display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    width: 100%; max-width: var(--content);
    margin-top: clamp(40px, 8vh, 72px);
  }
  .widget {
    display: flex; flex-direction: column;
    min-height: 280px; padding: 20px 22px 22px;
    background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow);
    transition: border-color .2s, background-color .3s;
  }
  .widget:focus-within { border-color: var(--line-strong); }
  .widget-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 22px; margin-bottom: 14px;
  }
  .widget-head h2 {
    margin: 0;
    font-size: .74rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted);
  }
  .widget-meta { font-size: .8rem; color: var(--muted); }
  .link-btn {
    padding: 0; background: none; border: 0;
    font-size: .8rem; color: var(--accent-ink);
  }
  .link-btn:hover { text-decoration: underline; }

  /* Notes */
  .notes-area {
    flex: 1; width: 100%; min-height: 200px; padding: 0;
    resize: vertical;
    font-size: .98rem; line-height: 1.65;
    background: transparent; border: 0; outline: 0;
  }
  .notes-area::placeholder { color: var(--muted); opacity: .75; }
  #notesStatus { opacity: 0; transition: opacity .4s; }
  #notesStatus.show { opacity: 1; }

  /* To-do */
  .todo-form { display: flex; gap: 8px; margin-bottom: 8px; }
  .todo-form input {
    flex: 1; min-width: 0; height: 40px; padding: 0 14px;
    font-size: .95rem;
    background: var(--surface-2); border: 1px solid transparent; border-radius: 12px;
    outline: 0; transition: border-color .2s, box-shadow .2s, background-color .3s;
  }
  .todo-form input::placeholder { color: var(--muted); opacity: .8; }
  .todo-form input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--ring); }
  .todo-form button {
    flex: none; width: 40px; height: 40px; border-radius: 12px;
    display: grid; place-items: center;
    background: var(--accent); border: 0; color: #fff;
    transition: transform .2s;
  }
  .todo-form button:hover { transform: scale(1.06); }
  .todo-form button svg { width: 18px; height: 18px; }

  .todo-list { list-style: none; margin: 0; padding: 0; max-height: 252px; overflow-y: auto; }
  .todo-empty { margin: 18px 0 0; font-size: .92rem; color: var(--muted); }
  .todo { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); }
  .todo:last-child { border-bottom: 0; }
  .todo label {
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 12px;
    padding: 11px 0; cursor: pointer;
  }
  .todo input[type="checkbox"] {
    appearance: none; -webkit-appearance: none;
    flex: none; width: 20px; height: 20px; margin: 0;
    display: grid; place-content: center;
    border: 1.5px solid var(--line-strong); border-radius: 50%;
    cursor: pointer;
    transition: background-color .2s, border-color .2s;
  }
  .todo input[type="checkbox"]:hover { border-color: var(--accent); }
  .todo input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
  .todo input[type="checkbox"]:checked::after {
    content: ""; width: 5px; height: 9px; margin-top: -2px;
    border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .todo-text { min-width: 0; font-size: .95rem; overflow-wrap: anywhere; transition: color .2s; }
  .todo.done .todo-text { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }
  .todo-del {
    flex: none; width: 28px; height: 28px; border-radius: 8px;
    display: grid; place-items: center;
    background: none; border: 0; color: var(--muted);
    opacity: 0; transition: opacity .15s, color .15s, background-color .15s;
  }
  .todo-del svg { width: 14px; height: 14px; }
  .todo:hover .todo-del, .todo-del:focus-visible, .todo:focus-within .todo-del { opacity: 1; }
  .todo-del:hover { color: var(--accent-ink); background: var(--accent-soft); }
  @media (hover: none) { .todo-del { opacity: 1; } }

  /* ---------- Entrance ---------- */
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .stage > * { animation: rise .6s cubic-bezier(.2, .7, .2, 1) both; }
  .stage > :nth-child(2) { animation-delay: .05s; }
  .stage > :nth-child(3) { animation-delay: .10s; }
  .stage > :nth-child(4) { animation-delay: .16s; }
  .stage > :nth-child(5) { animation-delay: .22s; }

  /* ---------- Small screens ---------- */
  @media (max-width: 520px) {
    .page { padding: 0 16px; }
    .search { height: 58px; padding-left: 20px; }
    .search input { font-size: 1.05rem; }
    .search .kbd { display: none; }
    .tiles { gap: 10px; }
    .tile { width: calc((100% - 20px) / 3); padding: 16px 6px 13px; }
    .widgets { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

<body>
<div class="page">

  <header class="topbar">
    <div class="clock">
      <time id="time" class="clock-time"></time>
      <span id="date" class="clock-date"></span>
    </div>

    <button id="themeToggle" class="icon-btn" type="button" aria-label="Switch to dark mode" title="Toggle dark mode">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
    </button>
  </header>

  <main class="stage">
    <p id="greeting" class="greeting"></p>

    <form id="searchForm" class="search" role="search" autocomplete="off">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-3.9-3.9"/></svg>
      <label class="sr-only" for="q">Search the web</label>
      <input id="q" name="q" type="search" enterkeyhint="search" spellcheck="false" autocapitalize="off" placeholder="Search">
      <span class="kbd" aria-hidden="true">/</span>
      <button class="go" type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <div id="engines" class="engines" role="group" aria-label="Search engine"></div>

    <nav id="links" class="tiles" aria-label="Quick links"></nav>

    <section id="widgets" class="widgets" aria-label="Widgets">
      <article id="notesWidget" class="widget" hidden>
        <div class="widget-head">
          <h2>Notes</h2>
          <span id="notesStatus" class="widget-meta" role="status"></span>
        </div>
        <textarea id="notes" class="notes-area" aria-label="Notes scratchpad" placeholder="Jot something down. It saves as you type." spellcheck="true"></textarea>
      </article>

      <article id="todoWidget" class="widget" hidden>
        <div class="widget-head">
          <h2>To-do</h2>
          <span class="widget-meta">
            <span id="todoCount"></span>
            <button id="todoClear" class="link-btn" type="button" hidden>Clear done</button>
          </span>
        </div>
        <form id="todoForm" class="todo-form" autocomplete="off">
          <label class="sr-only" for="todoInput">New task</label>
          <input id="todoInput" type="text" placeholder="Add a task" maxlength="280">
          <button type="submit" aria-label="Add task">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </form>
        <ul id="todoList" class="todo-list"></ul>
        <p id="todoEmpty" class="todo-empty">Nothing on the list. Enjoy it.</p>
      </article>
    </section>
  </main>

</div>

<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;

  /* ---------- localStorage, wrapped so a blocked/full store never breaks the page ---------- */
  const store = {
    get(key, fallback) {
      try {
        const raw = localStorage.getItem(STORE_PREFIX + key);
        return raw === null ? fallback : JSON.parse(raw);
      } catch (e) { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem(STORE_PREFIX + key, JSON.stringify(value)); return true; }
      catch (e) { return false; }
    },
  };

  /* ---------- Clock, date, greeting ---------- */
  const clock = CONFIG.clock || {};
  const timeFmt = new Intl.DateTimeFormat(undefined, {
    hour: "numeric", minute: "2-digit",
    second: clock.showSeconds ? "2-digit" : undefined,
    hour12: clock.hour12,
  });
  const dateFmt = new Intl.DateTimeFormat(undefined, { weekday: "long", month: "long", day: "numeric" });

  function greetingFor(hour) {
    if (hour >= 5 && hour < 12) return "Good morning";
    if (hour >= 12 && hour < 17) return "Good afternoon";
    return "Good evening";
  }

  function renderClock() {
    const now = new Date();
    const parts = timeFmt.formatToParts(now).map((p) => {
      if (p.type !== "dayPeriod") return document.createTextNode(p.value);
      const span = document.createElement("span");
      span.className = "period";
      span.textContent = p.value;
      return span;
    });
    $("time").replaceChildren(...parts);
    $("time").dateTime = now.toISOString();
    $("date").textContent = dateFmt.format(now);
    $("greeting").textContent = greetingFor(now.getHours()) + (CONFIG.name ? ", " + CONFIG.name : "");
  }

  function tickClock() {
    renderClock();
    const step = clock.showSeconds ? 1000 : 60000;
    setTimeout(tickClock, step - (Date.now() % step) + 15); // land just after the boundary
  }
  tickClock();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) renderClock(); });

  /* ---------- Theme toggle ---------- */
  const themeBtn = $("themeToggle");
  function syncThemeButton() {
    const dark = root.dataset.theme === "dark";
    themeBtn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
  }
  themeBtn.addEventListener("click", () => {
    const next = root.dataset.theme === "dark" ? "light" : "dark";
    root.dataset.theme = next;
    store.set("theme", next);
    syncThemeButton();
  });
  syncThemeButton();

  /* ---------- Search ---------- */
  const engines = CONFIG.searchEngines;
  const engineKeys = Object.keys(engines);
  let engineKey = store.get("engine", null);
  if (!engines[engineKey]) engineKey = engines[CONFIG.searchEngine] ? CONFIG.searchEngine : engineKeys[0];

  const searchInput = $("q");
  const engineBox = $("engines");

  function renderEngines() {
    searchInput.placeholder = "Search with " + engines[engineKey].label;
    engineBox.replaceChildren(...engineKeys.map((key) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = engines[key].label;
      btn.setAttribute("aria-pressed", String(key === engineKey));
      btn.addEventListener("click", () => {
        engineKey = key;
        store.set("engine", key);
        renderEngines();
        searchInput.focus();
      });
      return btn;
    }));
  }
  renderEngines();

  $("searchForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const query = searchInput.value.trim();
    if (query) window.location.assign(engines[engineKey].url + encodeURIComponent(query));
  });

  // Press "/" anywhere to jump to the search bar.
  document.addEventListener("keydown", (e) => {
    if (e.key !== "/" || e.ctrlKey || e.metaKey || e.altKey) return;
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || document.activeElement.isContentEditable) return;
    e.preventDefault();
    searchInput.focus();
  });

  // Autofocus on devices with a real pointer; on phones it would just pop the keyboard.
  if (window.matchMedia("(hover: hover)").matches) searchInput.focus();

  /* ---------- Quick-link tiles ---------- */
  function faviconFor(link) {
    if (link.icon) return link.icon;
    try {
      return "https://www.google.com/s2/favicons?sz=128&domain=" + encodeURIComponent(new URL(link.url).hostname);
    } catch (e) { return null; }
  }

  function monogram(name) {
    const span = document.createElement("span");
    span.className = "mono";
    span.textContent = (name || "?").trim().charAt(0).toUpperCase();
    return span;
  }

  $("links").replaceChildren(...CONFIG.links.map((link) => {
    const a = document.createElement("a");
    a.className = "tile";
    a.href = link.url;
    a.rel = "noopener noreferrer";

    const icon = document.createElement("span");
    icon.className = "tile-icon";
    const src = faviconFor(link);
    if (src) {
      const img = document.createElement("img");
      img.alt = "";
      img.src = src;
      img.referrerPolicy = "no-referrer";
      img.addEventListener("error", () => img.replaceWith(monogram(link.name)), { once: true });
      icon.append(img);
    } else {
      icon.append(monogram(link.name));
    }

    const label = document.createElement("span");
    label.className = "tile-label";
    label.textContent = link.name;

    a.append(icon, label);
    return a;
  }));

  /* ---------- Widgets ---------- */
  const widgetCfg = CONFIG.widgets || {};
  $("notesWidget").hidden = !widgetCfg.notes;
  $("todoWidget").hidden = !widgetCfg.todo;
  $("widgets").hidden = !widgetCfg.notes && !widgetCfg.todo;

  /* Notes */
  const notes = $("notes");
  const notesStatus = $("notesStatus");
  let statusTimer;

  function flashStatus(text) {
    notesStatus.textContent = text;
    notesStatus.classList.add("show");
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => notesStatus.classList.remove("show"), 1400);
  }

  notes.value = store.get("notes", "");
  notes.addEventListener("input", () => {
    flashStatus(store.set("notes", notes.value) ? "Saved" : "Not saved (storage blocked)");
  });

  /* To-do */
  const todoList = $("todoList");
  const todoInput = $("todoInput");
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const loadTodos = () => {
    const saved = store.get("todos", []);
    return Array.isArray(saved)
      ? saved.filter((t) => t && typeof t.text === "string").map((t) => ({ id: String(t.id), text: t.text, done: !!t.done }))
      : [];
  };
  let todos = loadTodos();
  const saveTodos = () => store.set("todos", todos);

  const closeIcon =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';

  function todoNode(todo) {
    const li = document.createElement("li");
    li.className = "todo" + (todo.done ? " done" : "");
    li.dataset.id = todo.id;

    const label = document.createElement("label");
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = todo.done;
    const text = document.createElement("span");
    text.className = "todo-text";
    text.textContent = todo.text;
    label.append(box, text);

    const del = document.createElement("button");
    del.type = "button";
    del.className = "todo-del";
    del.setAttribute("aria-label", "Delete task: " + todo.text);
    del.innerHTML = closeIcon;

    li.append(label, del);
    return li;
  }

  function renderTodos() {
    const open = todos.filter((t) => !t.done).length;
    $("todoCount").textContent = todos.length ? open + " open" : "";
    $("todoClear").hidden = !todos.some((t) => t.done);
    $("todoEmpty").hidden = todos.length > 0;
    todoList.replaceChildren(...todos.map(todoNode));
  }
  renderTodos();

  $("todoForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = todoInput.value.trim();
    if (!text) return;
    todos.unshift({ id: newId(), text, done: false });
    todoInput.value = "";
    saveTodos();
    renderTodos();
  });

  todoList.addEventListener("change", (e) => {
    const li = e.target.closest(".todo");
    const todo = li && todos.find((t) => t.id === li.dataset.id);
    if (!todo) return;
    todo.done = e.target.checked;
    saveTodos();
    renderTodos();
  });

  todoList.addEventListener("click", (e) => {
    const del = e.target.closest(".todo-del");
    if (!del) return;
    const id = del.closest(".todo").dataset.id;
    todos = todos.filter((t) => t.id !== id);
    saveTodos();
    renderTodos();
  });

  $("todoClear").addEventListener("click", () => {
    todos = todos.filter((t) => !t.done);
    saveTodos();
    renderTodos();
  });

  /* ---------- Keep several open tabs in sync ---------- */
  window.addEventListener("storage", (e) => {
    if (e.key === STORE_PREFIX + "todos") { todos = loadTodos(); renderTodos(); }
    else if (e.key === STORE_PREFIX + "notes" && document.activeElement !== notes) notes.value = store.get("notes", "");
    else if (e.key === STORE_PREFIX + "theme") {
      const t = store.get("theme", null);
      if (t === "light" || t === "dark") { root.dataset.theme = t; syncThemeButton(); }
    }
  });
})();
</script>
</body>
</html>
