# Keep everything local and private.
[browser]
gatherUsageStats = false

[server]
address = "localhost"
# headless: no first-run email prompt; run.sh / run.bat open the browser for you
headless = true
maxUploadSize = 50

[theme]
base = "light"

[client]
# hide the "Deploy" button (this app is meant to stay on your computer)
toolbarMode = "minimal"
